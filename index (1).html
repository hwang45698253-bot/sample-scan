<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#14141e">
  <title>샘플 입출고 스캔</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Malgun Gothic', sans-serif;
      background: #14141e; color: #e6e6f0;
      padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
      max-width: 560px; margin: 0 auto;
    }
    h2 { font-size: 1.1rem; margin-bottom: 12px; }
    label { display: block; font-size: 0.8rem; color: #a0a0b2; margin: 10px 0 4px; }
    input, select {
      width: 100%; padding: 12px; font-size: 1rem; border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #e6e6f0;
    }
    input:focus, select:focus { outline: none; border-color: #6366f1; }
    #partNo { font-weight: 700; letter-spacing: 0.5px; }
    #partNo.filled { border-color: #4ade80; background: rgba(74,222,128,0.08); }

    #scanBtn {
      width: 100%; padding: 18px; font-size: 1.15rem; font-weight: 700;
      border: none; border-radius: 12px; color: #fff;
      background: linear-gradient(135deg, #0891b2, #06b6d4);
      box-shadow: 0 4px 16px rgba(8,145,178,0.35); cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    #scanBtn:disabled { opacity: 0.6; cursor: not-allowed; }

    #scanHint { text-align: center; font-size: 0.78rem; color: #9ca3af; margin-top: 10px; line-height: 1.5; }
    #preview { display: none; width: 100%; margin-top: 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); max-height: 280px; object-fit: contain; background: #000; }

    .type-toggle { display: flex; gap: 8px; margin-top: 10px; }
    .type-toggle button { flex: 1; padding: 12px; font-size: 1rem; font-weight: 700; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #a0a0b2; cursor: pointer; }
    #btn-in.active { background: #16a34a; border-color: #16a34a; color: #fff; }
    #btn-out.active { background: #dc2626; border-color: #dc2626; color: #fff; }
    
    .event-toggle { display: flex; gap: 6px; }
    .event-toggle button { flex: 1; padding: 12px 2px; font-size: 0.95rem; font-weight: 700; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #a0a0b2; cursor: pointer; }
    .event-toggle button.active { background: #0891b2; border-color: #0891b2; color: #fff; }

    #save { width: 100%; margin-top: 16px; padding: 16px; font-size: 1.05rem; font-weight: 700; border: none; border-radius: 10px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; cursor: pointer; }
    #save:disabled { opacity: 0.5; cursor: not-allowed; }
    .chk { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 0.85rem; color: #a0a0b2; }
    .chk input { width: auto; }
    #msg { margin-top: 10px; text-align: center; font-size: 0.9rem; min-height: 1.2em; font-weight: 600; }
    #msg.ok { color: #4ade80; }
    #msg.err { color: #f87171; }
    #msg.warn { color: #fbbf24; }
    #partInfo { margin-top: 6px; font-size: 0.85rem; color: #a78bfa; min-height: 1.1em; font-weight: 600; }
    #rawBox { margin-top: 8px; font-size: 0.72rem; color: #6b7280; word-break: break-all; }
    hr.sep { border: none; border-top: 1px solid rgba(255,255,255,0.08); margin: 16px 0 4px; }

    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .ver { font-size: 0.62rem; font-weight: 400; color: #6b7280; vertical-align: middle; margin-left: 6px; }
    .icon-btn { width: 40px; height: 40px; flex-shrink: 0; border-radius: 10px; font-size: 1.2rem; border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.05); color: #a0a0b2; cursor: pointer; }
    [hidden] { display: none !important; }

    .card { margin-top: 14px; padding: 16px; border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); }
    .card h3 { font-size: 0.95rem; margin-bottom: 4px; }
    .card .desc { font-size: 0.75rem; color: #6b7280; line-height: 1.5; }
    .row { display: flex; gap: 8px; margin-top: 10px; }
    .row input { flex: 1; min-width: 0; }
    .row .w-code { flex: 0 0 90px; text-transform: uppercase; }
    .btn { padding: 12px 16px; font-size: 0.92rem; font-weight: 700; border: none; border-radius: 8px; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; flex-shrink: 0; cursor: pointer; }
    .btn.ghost { background: transparent; border: 1px solid rgba(255,255,255,0.15); color: #a0a0b2; }
    .btn.danger { background: linear-gradient(135deg, #b91c1c, #dc2626); }
    .list { margin-top: 12px; max-height: 260px; overflow-y: auto; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); }
    .list table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    .list th, .list td { padding: 9px 8px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .list th { position: sticky; top: 0; background: #1b1b28; color: #a0a0b2; font-weight: 600; }
    .list td { color: #e6e6f0; }
  </style>
  <!-- Tesseract.js (OCR 문자 인식 라이브러리) -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>
  <div class="topbar">
    <h2>📦 샘플 입출고 스캔 <span class="ver">v2.0.0</span></h2>
    <button class="icon-btn" id="adminBtn" title="관리">⚙️</button>
  </div>

  <div id="scanView">
    <button id="scanBtn">📸 촬영 후 문자 스캔</button>
    <input type="file" id="photoInput" accept="image/*" capture="environment" style="display:none">

    <div id="scanHint">버튼을 누르면 카메라가 켜지며,<br>사진을 찍으면 라벨의 문자를 읽어 품번을 자동 입력합니다.</div>

    <img id="preview" alt="촬영한 사진">
    <canvas id="processCanvas" style="display:none;"></canvas>

    <hr class="sep">

    <label>품번 (스캔 시 자동 입력)</label>
    <input id="partNo" placeholder="스캔하거나 직접 입력">
    <div id="partInfo"></div>

    <div class="type-toggle">
      <button id="btn-in" class="active">입고</button>
      <button id="btn-out">출고</button>
    </div>

    <label>수량</label>
    <input id="qty" type="number" min="1" value="1" inputmode="numeric">

    <label>이벤트</label>
    <div class="event-toggle" id="eventToggle">
      <button type="button">P0</button>
      <button type="button">P1</button>
      <button type="button">P2</button>
      <button type="button">M</button>
      <button type="button">SOP</button>
    </div>

    <label>비고 (선택)</label>
    <input id="memo">

    <button id="save">저장</button>
    <label class="chk"><input type="checkbox" id="keepScanning" checked> 저장 후 바로 다음 스캔</label>
    <div id="msg"></div>
    <div id="rawBox"></div>
  </div>

  <div id="adminView" hidden>
    <div class="card">
      <h3>🚗 차종 코드 추가</h3>
      <div class="desc">품번마스터 A열(차종코드) · B열(차종)에 등록됩니다.</div>
      <div class="row">
        <input id="carCode" class="w-code" placeholder="DC" maxlength="4" autocomplete="off">
        <input id="carName" placeholder="차종 (예: JG1)" autocomplete="off">
        <button class="btn" id="addCarBtn">추가</button>
      </div>
      <div class="list" id="carList"></div>
    </div>

    <div class="card">
      <h3>🗑️ 재고 일괄 삭제</h3>
      <div class="desc">선택한 품번의 입출고 기록 행을 시트에서 완전히 삭제합니다.</div>
      <div class="row">
        <button class="btn ghost" id="loadStockBtn" style="width:100%;">재고 불러오기</button>
      </div>
      <div class="row">
        <input id="stockSearch" placeholder="🔍 품번 검색" autocomplete="off">
      </div>
      <div class="list" id="stockList"></div>
      <button class="btn danger" id="disposeBtn" style="width:100%; margin-top:10px;" disabled>선택 항목 삭제</button>
    </div>

    <div id="adminMsg"></div>
    <button class="btn ghost" id="backBtn" style="width:100%; margin-top:16px;">← 스캔 화면으로</button>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxeXfzUT9mrhi9CwxJqnurzrnusfkXNSOTvoN9SrAicNB8hIJpWmUq-zh5eShfkIw0c/exec';
    const API_TOKEN = 'rd-sample-2026-7f3a9c1b';

    let type = '입고';
    let event_ = '';
    let masterRows = [];
    let ocrWorker = null;

    const $ = id => document.getElementById(id);

    function showMsg(text, cls) {
      const m = $('msg');
      m.textContent = text;
      m.className = cls || '';
    }

    const normPartNo = s => String(s || '').replace(/[^A-Za-z0-9]/g, '').toUpperCase();
    function colAt(row, idx) {
      const keys = Object.keys(row || {});
      return idx < keys.length ? String(row[keys[idx]] == null ? '' : row[keys[idx]]).trim() : '';
    }
    
    function lookupPart(partNo) {
      const key = normPartNo(partNo);
      const carCode = key.slice(5, 7);
      const prefix = key.slice(0, 5);
      let car = '', name = '';
      masterRows.forEach(r => {
        if (carCode && colAt(r, 0).toUpperCase() === carCode) car = colAt(r, 1);
        if (prefix && colAt(r, 2).toUpperCase() === prefix) name = colAt(r, 3);
      });
      return { car, name };
    }

    function showPartInfo(partNo) {
      const box = $('partInfo');
      if (!partNo) { box.textContent = ''; return; }
      const info = lookupPart(partNo);
      const parts = [info.car, info.name].filter(Boolean);
      box.textContent = parts.length ? '📋 ' + parts.join(' / ') : '⚠️ 품번마스터에 없는 품번입니다';
    }

    fetch(API_URL + '?action=master')
      .then(r => r.json())
      .then(d => { masterRows = (d && d.master) || []; })
      .catch(() => {});

    // OCR 전용 Tesseract 워커 생성 및 파라미터(영문 대문자, 숫자, 하이픈) 제한 설정
    async function getOcrWorker() {
      if (!ocrWorker) {
        showMsg('문자 인식 엔진 초기화 중...');
        ocrWorker = await Tesseract.createWorker('eng');
        await ocrWorker.setParameters({
          tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-',
        });
      }
      return ocrWorker;
    }

    // OCR 결과 텍스트 중 가장 유력한 품번 문자열 추출
    function extractPartNoFromText(rawText) {
      if (!rawText) return '';
      
      const lines = rawText.split(/[\r\n]+/);
      const candidates = [];

      for (let line of lines) {
        const words = line.trim().split(/\s+/);
        for (let w of words) {
          // 특수문자 제거 (하이픈 유지)
          let clean = w.replace(/[^A-Za-z0-9-]/g, '').toUpperCase();
          
          // P 식별자 접두사 처리 (예: P86350-Q5000 -> 86350-Q5000)
          if (clean.startsWith('P') && clean.length >= 8 && /^[A-Z0-9-]{7,}$/.test(clean.slice(1))) {
            clean = clean.slice(1);
          }

          // 품번 조건 (6자 이상 20자 이하)
          if (clean.length >= 6 && clean.length <= 20) {
            candidates.push(clean);
          }
        }
      }

      if (candidates.length > 0) {
        // 하이픈 포함 여부, 알파벳+숫자 혼합 여부, 길이를 기준으로 가중치 정렬
        candidates.sort((a, b) => {
          let aScore = (a.includes('-') ? 3 : 0) + ((/[A-Z]/.test(a) && /[0-9]/.test(a)) ? 2 : 0) + (a.length * 0.1);
          let bScore = (b.includes('-') ? 3 : 0) + ((/[A-Z]/.test(b) && /[0-9]/.test(b)) ? 2 : 0) + (b.length * 0.1);
          return bScore - aScore;
        });
        return candidates[0];
      }

      return rawText.replace(/[^A-Za-z0-9-]/g, '').toUpperCase().slice(0, 20);
    }

    // 메인 스캔 버튼 클릭 시 바로 카메라 촬영/파일 선택창 실행
    $('scanBtn').addEventListener('click', () => {
      $('photoInput').click();
    });

    $('photoInput').addEventListener('change', async e => {
      const file = e.target.files[0];
      if (!file) return;

      const scanBtn = $('scanBtn');
      scanBtn.disabled = true;
      showMsg('🔍 이미지 분석 및 문자 인식(OCR) 중...');

      const preview = $('preview');
      const objectUrl = URL.createObjectURL(file);
      preview.src = objectUrl;
      preview.style.display = 'block';

      try {
        const img = new Image();
        img.src = objectUrl;
        await new Promise(resolve => { img.onload = resolve; });

        // 이미지 선명도 향상 및 리사이징 캔버스 처리
        const canvas = $('processCanvas');
        const ctx = canvas.getContext('2d');
        const maxDim = 1600;
        let w = img.width, h = img.height;
        if (w > maxDim || h > maxDim) {
          if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
          else { w = Math.round((w * maxDim) / h); h = maxDim; }
        }
        canvas.width = w;
        canvas.height = h;
        ctx.drawImage(img, 0, 0, w, h);

        // Tesseract OCR 실행
        const worker = await getOcrWorker();
        const ret = await worker.recognize(canvas);
        const recognizedText = (ret && ret.data && ret.data.text) ? ret.data.text : '';

        const partNo = extractPartNoFromText(recognizedText);

        if (partNo) {
          onScanSuccess(partNo, recognizedText);
        } else {
          showMsg('문자를 인식하지 못했습니다. 품번 라벨이 잘 보이게 다시 촬영해 주세요.', 'err');
          $('rawBox').textContent = recognizedText ? ('인식된 원문: ' + recognizedText) : '';
        }
      } catch (err) {
        console.error('OCR Error:', err);
        showMsg('문자 인식 실패. 사진 상태를 확인해 주세요.', 'err');
      } finally {
        scanBtn.disabled = false;
        e.target.value = '';
      }
    });

    function onScanSuccess(partNo, rawText) {
      const input = $('partNo');
      input.value = partNo;
      input.classList.add('filled');
      if (navigator.vibrate) navigator.vibrate(100);

      $('rawBox').textContent = '인식 원문: ' + (rawText || partNo).replace(/\s+/g, ' ').trim();
      showMsg('✅ 문자 인식 완료: ' + partNo, 'ok');
      showPartInfo(partNo);

      const qty = $('qty');
      qty.focus(); qty.select();
    }

    $('partNo').addEventListener('change', function () { showPartInfo(this.value.trim()); });

    function setType(t) {
      type = t;
      $('btn-in').classList.toggle('active', t === '입고');
      $('btn-out').classList.toggle('active', t === '출고');
    }
    $('btn-in').addEventListener('click', () => setType('입고'));
    $('btn-out').addEventListener('click', () => setType('출고'));

    document.querySelectorAll('#eventToggle button').forEach(b => {
      b.addEventListener('click', () => {
        event_ = (event_ === b.textContent) ? '' : b.textContent;
        document.querySelectorAll('#eventToggle button').forEach(x => {
          x.classList.toggle('active', x.textContent === event_);
        });
      });
    });

    async function postApi(payload) {
      const body = JSON.stringify({ token: API_TOKEN, ...payload });
      const res = await fetch(API_URL, { method: 'POST', body: body });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || '요청이 거절되었습니다.');
      return data;
    }

    async function save() {
      const partNo = $('partNo').value.trim();
      const qty = Number($('qty').value);
      const memo = $('memo').value.trim();
      if (!partNo) { showMsg('품번을 입력하세요.', 'err'); return; }
      if (!qty || qty < 1) { showMsg('수량을 확인하세요.', 'err'); return; }

      const btn = $('save');
      btn.disabled = true;
      showMsg('저장 중...');

      const payload = { action: 'add', partNo, type, qty, event: event_, memo };

      try {
        await postApi(payload);
        afterSave(`✅ 저장 완료: ${partNo} / ${type} / ${qty}개`, 'ok');
      } catch (err) {
        try {
          await fetch(API_URL, {
            method: 'POST', mode: 'no-cors',
            body: JSON.stringify({ token: API_TOKEN, ...payload })
          });
          afterSave('⚠️ 전송 완료 (시트에서 확인 요망)', 'warn');
        } catch (e2) {
          showMsg('저장 실패', 'err');
        }
      } finally {
        btn.disabled = false;
      }
    }

    function afterSave(text, cls) {
      showMsg(text, cls);
      $('partNo').value = '';
      $('partNo').classList.remove('filled');
      $('partInfo').textContent = '';
      $('rawBox').textContent = '';
      $('qty').value = 1;
      $('memo').value = '';
      if ($('keepScanning').checked) $('scanBtn').click();
    }

    $('save').addEventListener('click', save);

    let stockRows = [];
    let selectedKeys = {};

    const esc = s => String(s || '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[m]));
    const showAdminMsg = (text, cls) => { const m = $('adminMsg'); m.textContent = text; m.className = cls || ''; };

    $('adminBtn').addEventListener('click', () => {
      $('scanView').hidden = true; $('adminView').hidden = false;
      showAdminMsg(''); renderCarList(); window.scrollTo(0, 0);
    });
    $('backBtn').addEventListener('click', () => {
      $('adminView').hidden = true; $('scanView').hidden = false; window.scrollTo(0, 0);
    });

    async function reloadMaster() {
      try {
        const r = await fetch(API_URL + '?action=master');
        const d = await r.json();
        if (d && d.master) masterRows = d.master;
      } catch (e) {}
    }

    function renderCarList() {
      const rows = masterRows.map(r => ({ code: colAt(r, 0), name: colAt(r, 1) })).filter(r => r.code);
      if (!rows.length) { $('carList').innerHTML = '<div style="padding:15px;text-align:center;color:#6b7280;">등록된 차종코드가 없습니다.</div>'; return; }
      const latest = rows.slice(-3).reverse();
      $('carList').innerHTML = `<table><thead><tr><th style="width:70px;">코드</th><th>차종</th></tr></thead><tbody>` +
        latest.map(r => `<tr><td><b>${esc(r.code)}</b></td><td>${esc(r.name)}</td></tr>`).join('') + `</tbody></table>`;
    }

    $('addCarBtn').addEventListener('click', async function () {
      const code = $('carCode').value.trim().toUpperCase();
      const name = $('carName').value.trim();
      if (!code || !name) { showAdminMsg('입력 확인', 'err'); return; }
      this.disabled = true; showAdminMsg('저장 중...');
      try {
        await postApi({ action: 'addCarCode', code, name });
        showAdminMsg('✅ 추가 완료', 'ok');
        $('carCode').value = ''; $('carName').value = '';
        await reloadMaster(); renderCarList();
      } catch (err) { showAdminMsg('추가 실패', 'err'); }
      finally { this.disabled = false; }
    });

    $('loadStockBtn').addEventListener('click', async () => {
      $('stockList').innerHTML = '<div style="padding:15px;text-align:center;color:#6b7280;">불러오는 중...</div>';
      $('disposeBtn').disabled = true; selectedKeys = {};
      try {
        const r = await fetch(API_URL + '?action=stock');
        const d = await r.json();
        stockRows = (d.stock || []).filter(s => s.qty > 0).sort((a, b) => b.days - a.days);
        renderStockList();
      } catch (e) { $('stockList').innerHTML = '<div style="padding:15px;text-align:center;color:#f87171;">불러오기 실패했습니다.</div>'; }
    });

    function renderStockList() {
      const q = normPartNo($('stockSearch').value);
      const rows = q ? stockRows.filter(s => normPartNo(s.partNo).includes(q)) : stockRows.slice(0, 5);
      if (!rows.length) {
        $('stockList').innerHTML = '<div style="padding:15px;text-align:center;color:#6b7280;">결과가 없습니다.</div>';
        updateDisposeBtn(); return;
      }
      $('stockList').innerHTML = `<table><thead><tr>` +
        `<th style="width:34px;">선택</th><th>품번</th><th style="width:50px;text-align:right;">재고</th></tr></thead><tbody>` +
        rows.map(s => `<tr><td><input type="checkbox" class="chk-item" data-key="${esc(s.key)}" ${selectedKeys[s.key] ? 'checked' : ''}></td>` +
          `<td>${esc(s.partNo)}</td><td style="text-align:right;">${s.qty}</td></tr>`).join('') +
        `</tbody></table>`;

      document.querySelectorAll('#stockList .chk-item').forEach(c => {
        c.addEventListener('change', function () {
          if (this.checked) selectedKeys[this.dataset.key] = true; else delete selectedKeys[this.dataset.key];
          updateDisposeBtn();
        });
      });
      updateDisposeBtn();
    }

    $('stockSearch').addEventListener('input', renderStockList);

    function updateDisposeBtn() {
      const count = Object.keys(selectedKeys).length;
      $('disposeBtn').disabled = count === 0;
      $('disposeBtn').textContent = count ? `선택 항목(${count}건) 삭제` : '선택 항목 삭제';
    }

    $('disposeBtn').addEventListener('click', async function () {
      const keys = Object.keys(selectedKeys);
      if (!keys.length || !confirm('선택한 항목을 삭제합니다. 계속할까요?')) return;
      this.disabled = true; showAdminMsg('삭제 중...');
      try {
        await postApi({ action: 'delete', partNos: keys });
        showAdminMsg('✅ 삭제 완료', 'ok');
        $('loadStockBtn').click();
      } catch (err) { showAdminMsg('삭제 실패', 'err'); this.disabled = false; }
    });
  </script>
</body>
</html>
